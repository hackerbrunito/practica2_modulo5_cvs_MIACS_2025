model_details:
  name: Traffic Anomaly Detector
  version: '1.0'
  date: 2025-09
  type: RandomForestClassifier
  parameters:
    max_depth: 10
    n_estimators: 100
    random_state: 42
intended_use:
  primary_purpose: Detectar tráfico de red sospechoso
  users:
  - Analistas SOC
  - Investigadores seguridad
  out_of_scope:
  - Tráfico cifrado
  - Protocolos no TCP/UDP
training_data:
  dataset: traffic_processed.csv
  records: 33902
  features: 20
  target_distribution:
    normal: 75%
    suspicious: 25%
metrics:
  accuracy: 0.9991
  precision: 0.994
  recall: 0.982
  f1_score: 0.988
ethical_considerations:
- Sesgo hacia malware conocido
- No detecta amenazas zero-day
privacy_protection:
- IPs pseudonimizadas con SHA-256
- k-anonimidad aplicada con k=10
